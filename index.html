
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VR World Test</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>
<body>
  <a-scene background="color: #00BFFF">

    <a-box
      position="0 1.5 -3"
      color="#FF00FF"
      material="shader: flat">
    </a-box>

    <a-sphere
      position="1.5 1.5 -3"
      radius="0.6"
      color="#FFFF00"
      material="shader: flat">
    </a-sphere>

    <a-sky color="#00BFFF"></a-sky>

    <a-entity position="0 1.6 0">
      <a-camera></a-camera>
    </a-entity>

  </a-scene>
</body>
</html>
